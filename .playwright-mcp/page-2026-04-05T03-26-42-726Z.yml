                - paragraph [ref=e113]: Research Question
                - paragraph [ref=e114]: Does a single supervised session of psilocybin 25 mg combined with structured psychotherapy achieve superior remission rates compared to active placebo (niacin) in adults with treatment-resistant major depressive disorder at eight weeks?
                - paragraph [ref=e115]: "Evidence: Objectives, p.2"
            - generic [ref=e116]:
