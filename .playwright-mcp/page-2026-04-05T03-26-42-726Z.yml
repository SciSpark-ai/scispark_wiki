              - generic [ref=e118]:
                - paragraph [ref=e119]: Data & Sample
                - paragraph [ref=e120]: 246 adults aged 18–65 with TRD (≥2 failed adequate antidepressant trials), current MADRS ≥28, no psychotic or bipolar I history; enrolled across 14 academic centers in the UK and USA; median age 41 years; 54% female.
                - paragraph [ref=e121]: "Evidence: Participants & Eligibility, p.4–5"
            - generic [ref=e122]:
              - generic [ref=e123]: "3"
              - generic [ref=e124]:
                - paragraph [ref=e125]: Method Highlights
                - paragraph [ref=e126]: Double-blind RCT; psilocybin 25 mg vs niacin 250 mg in a single supervised 6–8 hour session with two trained therapists; standardized preparatory sessions (3 × 60 min) and integration sessions (3 × 60 min); primary endpoint MADRS remission at week 8; fMRI substudy in 68 participants at 24 h post-dose.
                - paragraph [ref=e127]: "Evidence: Trial Design & Procedures, p.5–7, Figure S1"
            - generic [ref=e128]:
              - generic [ref=e129]: "4"
