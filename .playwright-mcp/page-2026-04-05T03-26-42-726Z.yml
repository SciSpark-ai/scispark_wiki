                - paragraph [ref=e131]: Key Results
                - paragraph [ref=e132]: "Remission at week 8: 37.5% psilocybin vs 12.3% niacin (OR 4.26, p<0.001); MADRS change −14.2 points favoring psilocybin; 68% sustained remission at week 24; DMN entropy increase at 24 h correlated with week-8 response (r=0.54, p<0.001)."
                - paragraph [ref=e133]: "Evidence: Results, p.8–12, Tables 2–3"
