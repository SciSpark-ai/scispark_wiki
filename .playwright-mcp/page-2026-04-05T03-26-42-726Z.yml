                - paragraph [ref=e138]: Findings support psilocybin as a rapid-acting and durable intervention for TRD; blinding integrity was imperfect given subjective psilocybin effects; generalizability to older adults and those with comorbid anxiety disorders is uncertain; longer-term safety beyond 6 months has not been established.
