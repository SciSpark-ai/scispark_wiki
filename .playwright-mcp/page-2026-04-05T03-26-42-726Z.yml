              - paragraph [ref=e98]: Figure 1
              - generic [ref=e99]:
                - generic [ref=e100]:
                  - generic [ref=e101]: •
                  - text: MADRS total score trajectories from baseline through week 24 show rapid divergence between psilocybin and niacin arms by week 1, widening to a between-group difference of 14.2 points at week 8 and maintained at 12.8 points at week 24.
                - generic [ref=e102]:
                  - generic [ref=e103]: •
                  - text: A waterfall plot of individual MADRS change scores at week 8 illustrates the broad distribution of large responses (>50% score reduction) in the psilocybin arm versus the tight near-zero cluster in the niacin arm.
                - generic [ref=e104]:
                  - generic [ref=e105]: •
                  - text: fMRI subgroup panel depicts default mode network entropy maps at 24 hours post-dose; responders show significantly greater posterior cingulate and medial prefrontal cortex entropy relative to non-responders (p<0.001, FDR-corrected).
                - generic [ref=e106]:
                  - generic [ref=e107]: •
                  - text: Scatter plot of MEQ-30 total score versus MADRS change at week 8 demonstrates a significant positive correlation (r=0.61, p<0.001), supporting acute mystical experience depth as a mediator of antidepressant response.
