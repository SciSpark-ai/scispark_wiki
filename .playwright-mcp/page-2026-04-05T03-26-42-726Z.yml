              - button "Lay Summary" [ref=e87]
              - button "Original Abstract" [ref=e88]
            - paragraph [ref=e89]: For people whose depression has not improved with at least two standard antidepressant medications, a single guided session using psilocybin — the active compound in psychedelic mushrooms — produced deep and lasting remission in more than a third of participants. Brain scans showed that psilocybin appears to 'loosen' rigid activity patterns in the brain regions associated with depressive rumination. Nearly seven in ten of those who responded were still in remission six months later, without any additional doses.
